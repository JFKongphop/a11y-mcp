<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tourist Visa Application — Demo</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 0 0 20px; padding: 16px; }
      legend { font-weight: 600; padding: 0 6px; }
      label { display: block; margin: 12px 0 4px; font-weight: 500; }
      input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #aaa; border-radius: 6px; }
      button { margin-top: 8px; padding: 10px 20px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
      .hint { color: #666; font-size: 13px; margin: 2px 0 0; }
    </style>
  </head>
  <body>
    <h1>Tourist Visa Application</h1>
    <p>A well-marked-up English form — the lead demo target. One field is deliberately unlabeled to show the <code>needs_human</code> path.</p>

    <form id="visa">
      <fieldset>
        <legend>Applicant</legend>

        <label for="given_name">Given name (as in passport)</label>
        <input id="given_name" name="given_name" type="text" autocomplete="given-name" required />

        <label for="family_name">Family name (as in passport)</label>
        <input id="family_name" name="family_name" type="text" autocomplete="family-name" required />

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required />

        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="+66..." />

        <label for="passport_no">Passport number</label>
        <input id="passport_no" name="passport_no" type="text" pattern="[A-Z]{1,2}[0-9]{6,8}" required />
        <p class="hint">1–2 letters followed by 6–8 digits.</p>

        <label for="national_id">National ID number</label>
        <input id="national_id" name="national_id" type="text" pattern="[0-9]{13}" maxlength="13" />
        <p class="hint">Exactly 13 digits.</p>
      </fieldset>

      <fieldset>
        <legend>Trip</legend>

        <label for="nationality">Nationality</label>
        <select id="nationality" name="nationality" required>
          <option value="">— select —</option>
          <option value="TH">Thailand</option>
          <option value="JP">Japan</option>
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
        </select>

        <label for="arrival">Date of arrival</label>
        <input id="arrival" name="arrival" type="date" required />

        <label for="stay_days">Length of stay (days)</label>
        <input id="stay_days" name="stay_days" type="number" min="1" max="90" required />

        <label for="purpose">Purpose of visit</label>
        <textarea id="purpose" name="purpose" rows="3" maxlength="500"></textarea>

        <!-- Deliberately unlabeled: no label, no aria, only a name. Confidence
             falls to "low" and this field must land in needs_human. -->
        <input id="mystery" name="ref_code" type="text" placeholder="" />
      </fieldset>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
