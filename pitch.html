<title>a11y-mcp Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
/>
<style>
  :root {
    --bg: #0d0c13;
    --bg-glow: #241a4d;
    --ink: #f3f1fa;
    --ink-soft: #a9a4bd;
    --ink-faint: #6f6a85;
    --accent: #8b7dff;
    --accent-bright: #b9adff;
    --line: rgba(255, 255, 255, 0.12);
    --thai: #c9c0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 12% 8%, var(--bg-glow) 0%, transparent 42%),
      radial-gradient(90% 80% at 92% 96%, #1a1330 0%, transparent 46%),
      var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 6vh 8vw;
    cursor: pointer;
  }

  .slide {
    position: absolute;
    max-width: 940px;
    width: 100%;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: none;
    pointer-events: auto;
    position: relative;
  }

  .kicker {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(11px, 1.3vw, 14px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
  }

  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 8.4vw, 104px);
    line-height: 0.98;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 .accent { color: var(--accent-bright); }

  h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5.6vw, 66px);
    line-height: 1.03;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h2 em { font-style: normal; color: var(--accent-bright); }

  .lead {
    font-size: clamp(18px, 2.6vw, 30px);
    color: var(--ink-soft);
    margin-top: 24px;
    max-width: 34ch;
    text-wrap: balance;
    line-height: 1.34;
  }
  .lead strong { color: var(--ink); font-weight: 600; }

  ul { list-style: none; margin-top: 34px; display: flex; flex-direction: column; gap: 18px; }
  li {
    font-size: clamp(17px, 2.5vw, 28px);
    line-height: 1.32;
    color: var(--ink);
    display: flex;
    gap: 16px;
    align-items: baseline;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.42s ease, transform 0.42s ease;
  }
  li.shown { opacity: 1; transform: none; }
  li .mark {
    flex: none;
    color: var(--accent);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.62em;
    transform: translateY(-0.15em);
  }
  li .th {
    font-family: "IBM Plex Sans Thai", "IBM Plex Sans", sans-serif;
    color: var(--thai);
    font-weight: 500;
    flex: none;
    min-width: 2.6em;
  }
  li .en { color: var(--ink-soft); }
  li strong { color: var(--ink); font-weight: 600; }

  .tools {
    margin-top: 30px;
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(13px, 1.9vw, 20px);
    color: var(--accent-bright);
    letter-spacing: 0.01em;
  }
  .tools span { color: var(--ink-faint); }

  .thai-big {
    font-family: "IBM Plex Sans Thai", sans-serif;
    color: var(--thai);
    font-weight: 600;
  }

  /* chrome: progress + nav */
  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 26px;
    z-index: 5;
  }
  #dots { display: flex; gap: 9px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--line);
    transition: background 0.3s ease, transform 0.3s ease;
    cursor: pointer;
  }
  .dot.on { background: var(--accent); transform: scale(1.25); }
  .dot.past { background: var(--ink-faint); }

  .nav { display: flex; gap: 8px; }
  .nav button {
    font: inherit;
    font-size: 14px;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 42px; height: 34px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .nav button:hover { color: var(--ink); border-color: var(--accent); }
  .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #counter {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  #hint {
    position: fixed;
    left: 50%; bottom: 64px;
    transform: translateX(-50%);
    font-size: 14px;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #hint.gone { opacity: 0; }

  a.repo { color: var(--accent-bright); text-decoration: none; border-bottom: 1px solid var(--line); }

  @media (prefers-reduced-motion: reduce) {
    .slide, li { transition: none; }
  }
</style>

<div id="stage" aria-live="polite"></div>

<div id="hint">click &nbsp;·&nbsp; → &nbsp;·&nbsp; space &nbsp;to&nbsp;advance</div>

<div id="bar">
  <div id="dots"></div>
  <div class="nav">
    <button id="prev" aria-label="Previous">&larr;</button>
    <button id="next" aria-label="Next">&rarr;</button>
  </div>
  <div id="counter"></div>
</div>

<script>
  const slides = [
    {
      kicker: "OpenAI WebMCP Challenge",
      html: `<h1>a11y&#8288;-&#8288;mcp</h1>
             <p class="lead">Speak Thai. Fill any English web form. <strong>Never touch the keyboard.</strong></p>`,
      reveals: [],
    },
    {
      kicker: "The problem",
      html: `<h2>Two failures, <em>stacked.</em></h2>`,
      reveals: [
        `<span class="mark">01</span><span><strong>AI agents "use" the web by guessing pixels</strong> — and guess wrong.</span>`,
        `<span class="mark">02</span><span>Accessibility tooling is <strong>built for English.</strong></span>`,
        `<span class="mark">03</span><span>A Thai person facing an English visa form is simply <strong>stuck.</strong></span>`,
      ],
    },
    {
      kicker: "The solution",
      html: `<h2>The page speaks the <em>agent's language.</em></h2>`,
      reveals: [
        `<span class="mark">&rarr;</span><span>The web page exposes <strong>typed tools</strong> via WebMCP.</span>`,
        `<span class="mark">&rarr;</span><span>You speak Thai &mdash; <strong>GPT calls those tools.</strong></span>`,
        `<span class="mark">&rarr;</span><span>The page replies with a <strong>typed error</strong>, not a red border.</span>`,
      ],
    },
    {
      kicker: "One conversation",
      html: `<h2>Read. Fill. Fix. <em>Ask.</em> Confirm.</h2>`,
      reveals: [
        `<span class="th">อ่าน</span><span class="en">reads the form aloud in Thai.</span>`,
        `<span class="th">กรอก</span><span class="en">fills every field from your voice.</span>`,
        `<span class="th">แก้</span><span class="en">self-corrects from the page's typed errors.</span>`,
        `<span class="th">ถาม</span><span class="en">asks in Thai when it isn't sure.</span>`,
        `<span class="th">ยืนยัน</span><span class="en">never submits without your confirmation.</span>`,
      ],
    },
    {
      kicker: "Why it matters",
      html: `<h2>A red border tells a human.<br>A <em>typed error</em> tells an agent.</h2>`,
      reveals: [
        `<span class="mark">&#9679;</span><span>Constraint feedback is the <strong>whole argument for WebMCP.</strong></span>`,
        `<span class="mark">&#9679;</span><span>And it works <strong>in Thai</strong> — for people accessibility tooling has never served.</span>`,
      ],
    },
    {
      kicker: "a11y-mcp",
      html: `<h2>A conversational accessibility agent<br>for the <em>open web.</em></h2>
             <p class="tools">describe_form <span>&middot;</span> read_form <span>&middot;</span> fill_form <span>&middot;</span> submit_form</p>
             <p class="lead"><span class="thai-big">พูดภาษาไทย</span> &mdash; and any English form fills itself.</p>`,
      reveals: [],
    },
  ];

  const stage = document.getElementById("stage");
  const dotsEl = document.getElementById("dots");
  const counter = document.getElementById("counter");
  const hint = document.getElementById("hint");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // build slides
  const slideEls = slides.map((s, i) => {
    const sec = document.createElement("section");
    sec.className = "slide";
    let inner = `<p class="kicker">${s.kicker}</p>` + s.html;
    if (s.reveals.length) {
      inner += "<ul>" + s.reveals.map((r) => `<li>${r}</li>`).join("") + "</ul>";
    }
    sec.innerHTML = inner;
    stage.appendChild(sec);
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.addEventListener("click", (e) => { e.stopPropagation(); go(i, 0); });
    dotsEl.appendChild(dot);
    return sec;
  });

  let si = 0; // slide index
  let ri = 0; // reveals shown on current slide

  function render() {
    slideEls.forEach((el, i) => {
      el.classList.toggle("active", i === si);
      const items = el.querySelectorAll("li");
      items.forEach((li, k) => li.classList.toggle("shown", i < si || (i === si && k < ri)));
    });
    document.querySelectorAll(".dot").forEach((d, i) => {
      d.classList.toggle("on", i === si);
      d.classList.toggle("past", i < si);
    });
    counter.textContent = String(si + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    if (si > 0 || ri > 0) hint.classList.add("gone");
  }

  function next() {
    if (ri < slides[si].reveals.length) ri++;
    else if (si < slides.length - 1) { si++; ri = 0; }
    render();
  }
  function prev() {
    if (ri > 0) ri--;
    else if (si > 0) { si--; ri = slides[si].reveals.length; }
    render();
  }
  function go(i, r) { si = i; ri = r; render(); }

  stage.addEventListener("click", next);
  document.getElementById("next").addEventListener("click", (e) => { e.stopPropagation(); next(); });
  document.getElementById("prev").addEventListener("click", (e) => { e.stopPropagation(); prev(); });
  addEventListener("keydown", (e) => {
    if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "Home") go(0, 0);
    else if (e.key === "End") go(slides.length - 1, slides[slides.length - 1].reveals.length);
  });

  render();
</script>
